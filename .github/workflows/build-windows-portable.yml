name: Build Windows portable

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "pdf_redact/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/build-windows-portable.yml"
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "pdf_redact/**"
      - "tests/**"
      - "Build-Portable.ps1"
      - "PDF-Redact.spec"
      - "run_app.py"
      - "run_batch.py"
      - "PDF-Redact-Batch.bat"
      - "Start-PDF-Redact.bat"
      - "portable.json"
      - "SETUP.txt"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/build-windows-portable.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install -U pip
          pip install "pymupdf>=1.24.0" "pillow>=10.0.0" "regex>=2024.0.0" "pytest>=8.0"
          pip install -e . --no-deps

      - name: Run tests
        run: pytest -q

  portable:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Tesseract (for bundling)
        run: choco install tesseract -y --no-progress
        continue-on-error: true

      - name: Build portable package
        shell: pwsh
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          ./Build-Portable.ps1 -BundleTesseract -OutputZip "$env:GITHUB_WORKSPACE/pdf-redact-portable.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pdf-redact-portable
          path: pdf-redact-portable.zip
          if-no-files-found: error
          retention-days: 30

      - name: Attach zip to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: pdf-redact-portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
