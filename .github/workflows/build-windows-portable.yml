name: Build Windows portable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "pdf_redact/**"
      - "Build-Portable.ps1"
      - "PDF-Redact.spec"
      - "run_app.py"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/build-windows-portable.yml"

jobs:
  portable:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tesseract (for bundling)
        run: choco install tesseract -y --no-progress
        continue-on-error: true

      - name: Build portable package
        shell: pwsh
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          ./Build-Portable.ps1 -BundleTesseract -OutputZip "$env:GITHUB_WORKSPACE/pdf-redact-portable.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-redact-portable
          path: pdf-redact-portable.zip
          if-no-files-found: error
          retention-days: 30

      - name: Attach zip to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: pdf-redact-portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
